name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,brian2]"
      - run: ruff check .
      - run: mypy
      - run: pytest
      - run: python -m build
      - run: flybrian-engine health
      - run: flybrian-engine validate examples/minimal-experiment.json
      - run: flybrian-engine run examples/brian2-golden-experiment.json --backend brian2 --output ci-runs
