[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flybrian-engine"
version = "0.1.14"
description = "Open experiment schema, execution adapters, artifacts, and local runner for FlyBrian"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "LICENSES/Apache-2.0.txt"]
authors = [{ name = "FlyBrian contributors" }]
dependencies = ["packaging>=24,<27"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
brian2 = ["brian2>=2.7,<3", "numpy>=2.0,<2.2", "pandas>=2.2,<3", "matplotlib>=3.9,<4", "pydantic>=2,<3"]
neuron = ["neuron==9.0.2", "netpyne==1.1.1", "numpy>=2.0,<2.2", "pandas>=2.2,<3", "matplotlib>=3.9,<4", "pydantic>=2,<3"]
body = ["mujoco==3.13.0", "imageio==2.37.4", "imageio-ffmpeg==0.6.0", "certifi>=2024,<2027"]
neuprint = ["neuprint-python>=0.6.3,<0.7"]
dev = ["build>=1.2", "mypy>=1.11", "pytest>=8.3", "ruff>=0.6", "pandas-stubs>=2.2,<3", "certifi>=2024,<2027"]

[project.scripts]
flybrian-engine = "flybrian_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flybrian_engine = ["py.typed", "data/*.json", "data/*.b64", "data/*.txt", "data/*.md", "mechanisms/*.mod"]

[tool.setuptools.data-files]
"." = ["THIRD_PARTY_NOTICES.md"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

# These optional scientific runtimes expose untyped native/dynamic APIs.
# Project modules remain under strict checking.
[[tool.mypy.overrides]]
module = ["brian2.*", "neuron.*", "netpyne.*", "mujoco.*", "imageio.*"]
ignore_missing_imports = true
